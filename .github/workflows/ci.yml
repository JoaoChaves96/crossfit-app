# The gate: types, unit tests, lint, schema drift, and the 15 Playwright
# journeys. Never touches a cloud provider, so it cannot be blocked by one being
# down or by a fork PR having no access to secrets.
#
# One workflow rather than two, because a deploy must depend on ALL of these and
# `workflow_run` can only name one workflow — see the `e2e` job's comment.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  # A new push supersedes the run in flight for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches docker-compose.yml, so a CI-only schema difference is not a
        # thing that can happen.
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - name: Types
        run: npx tsc --noEmit
        working-directory: backend

      - name: Lint
        # --fix is in the package script; CI must report, not rewrite.
        #
        # Reporting only, deliberately. On the day this workflow was written the
        # bare invocation had 921 errors, of which 253 are NOT auto-fixable —
        # almost all @typescript-eslint/no-unsafe-* against untyped supertest and
        # mock objects. So `npm run lint` never exited 0 either: lint has never
        # been a gate in this repo, and turning it into one here would paint every
        # pull request red for debt that predates it. Clearing those 253 is its
        # own piece of work; when it lands, delete this line and the gate is real.
        continue-on-error: true
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
        working-directory: backend

      - name: Unit tests
        run: npm test
        working-directory: backend

      - name: Schema drift
        # The gate from Task 11: builds a throwaway database from migrations
        # alone and asserts the entities describe nothing more.
        run: npm run schema:check
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-secret-not-used-for-anything-real

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Types
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Tests
        # jsdom reports 750px, so unpinned suites exercise the mobile layout
        # only. Suites that care about desktop pin the viewport themselves.
        run: npm test
        working-directory: frontend

  image:
    # Proves the Dockerfile still builds. No registry push — that is Phase 5.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    # The 15 Playwright journeys, hermetic: Postgres as a service container, the
    # schema from migrations, the API and Expo web booted by Playwright's own
    # webServer. Nothing here reaches a cloud provider, so a provider outage or a
    # fork PR with no secrets cannot block it.
    #
    # A job in `ci` rather than its own workflow, because `deploy` must depend on
    # BOTH this and the fast checks. `workflow_run` can only name one workflow, so
    # a separate workflow would deploy while this one was still red. Job-level
    # `needs` is the only real barrier GitHub offers.
    runs-on: ubuntu-latest
    # Serial by design (playwright.config.ts workers: 1 — measured, see its
    # comment). ~6 min on a runner; allow generously more.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          # There is no lock file at the repo root — the two apps each have
          # their own. Without these paths setup-node looks only at the root,
          # finds nothing, and fails the job before a single test runs. This
          # job installs both, so both are listed.
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - run: npm ci
        working-directory: backend

      - run: npm ci
        working-directory: frontend

      - name: Create the e2e database
        # global-setup.ts connects to it and refuses to create it, by design:
        # the name is a constant so no run can be pointed elsewhere.
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -c 'CREATE DATABASE crossfit_box_e2e'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Backend env
        # backend/.env is gitignored, and main.ts loads it via dotenv/config.
        # global-setup.ts runs the migrations; the API boots with synchronize
        # off (e2eBackendEnv sets NODE_ENV=production).
        run: |
          cat > backend/.env <<'EOF'
          JWT_SECRET=ci-e2e-secret-not-used-for-anything-real
          DB_HOST=localhost
          DB_PORT=5432
          DB_USERNAME=postgres
          DB_PASSWORD=postgres
          EOF

      - name: Journeys
        run: npm run test:e2e
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  deploy:
    # Staging deploys itself on every green push to `dev`.
    #
    # `needs` lists EVERY gate, the journeys included: a deploy that skipped
    # them would ship on unit tests and a type check alone, which is precisely
    # the class of breakage the journeys exist to catch. If any dependency fails
    # or is skipped, this job never starts.
    needs: [backend, frontend, image, e2e]
    # Pull requests must not deploy, and neither must `main` — there is exactly
    # one environment and `dev` owns it.
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # One environment, one deploy at a time. NOT cancel-in-progress: killing a
    # deploy midway through its release_command is how you get a migrated
    # database serving old code.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # ---- API -----------------------------------------------------------
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy the API
        # fly.toml carries the release_command that runs migrations against the
        # DIRECT Neon endpoint before any new machine takes traffic. A failed
        # migration aborts the deploy rather than serving a half-migrated schema.
        run: flyctl deploy --remote-only --app boxops-api-staging
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke the API
        # Against the real public origin, so DNS, the certificate and CORS
        # config are all in the path — not just the fly.dev name.
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            body="$(curl -fsS https://api.boxops.dev/health || true)"
            if [ "$body" = '{"status":"ok","database":"up"}' ]; then
              echo "API healthy: $body"; exit 0
            fi
            echo "attempt $i: $body"; sleep 5
          done
          echo "API did not become healthy"; exit 1

      # ---- Frontend ------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Build the web bundle
        # EXPO_PUBLIC_* is inlined at BUILD time, so this value is baked into the
        # bundle and cannot be changed by anything at runtime.
        #
        # export:web, not bare `expo export`: it chains
        # scripts/relocate-vendor-assets.mjs, without which every package-owned
        # asset lands under a node_modules path that Pages refuses to upload.
        run: npm run export:web
        working-directory: frontend
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.boxops.dev

      - name: Assert no asset sits under a node_modules path
        # Pages skips these silently and the SPA rewrite answers 200 with HTML,
        # so this must fail the build rather than reach production.
        run: test -z "$(find dist -path '*node_modules*')"
        working-directory: frontend

      - name: Assert the staging API URL was baked in
        # Expo resolves EXPO_PUBLIC_* from .env FILES in preference to the
        # environment (the behaviour that forced pinApiOrigin() to exist). No
        # .env.local exists on a runner, so the export above is correct — but
        # this asserts it rather than trusting it, because the failure mode is a
        # deployed app quietly calling localhost.
        run: |
          set -euo pipefail
          grep -rq "api.boxops.dev" dist/_expo
          if grep -rq "localhost:3000" dist/_expo; then
            echo "The bundle still points at localhost — an .env file won."; exit 1
          fi
          echo "Bundle targets https://api.boxops.dev"
        working-directory: frontend

      - name: Publish to Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name boxops-app --branch dev

      - name: Smoke the app
        # The second URL is the _redirects SPA fallback: without it, the one link
        # that must open for a stranger with no app installed returns 404.
        #
        # Both of these only prove something ANSWERED. Because `_redirects` ends
        # in `/* /index.html 200`, a file that was never uploaded also returns
        # 200 — with HTML. `staging-smoke` below is what actually checks the
        # deployment; this is a cheap early exit if Pages is down outright.
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null https://app.boxops.dev/
          curl -fsS -o /dev/null https://app.boxops.dev/invite/smoke-test-token
          echo "App and invite fallback both serve"

  staging-smoke:
    # Does the DEPLOYED app work? A real browser against the real Pages bundle,
    # the real certificate and staging's own API.
    #
    # This is the assertion neither the unit tests nor the 15 local journeys can
    # make: they never build or upload a bundle, so the entire deploy path — the
    # Pages upload, the API origin inlined at build time, CORS, the certificate
    # — is invisible to them. It was invisible when fonts silently failed to
    # upload and the app served a blank page while CI stayed green.
    #
    # READ-ONLY and unauthenticated, which is what keeps it cheap and safe: it
    # writes nothing, needs no seeded user, and opens no database connection, so
    # it can point at staging's own API without going near `boxops_staging`'s
    # hand-seeded demo data. The full write-path harness against an ephemeral
    # database is Task 9 in
    # docs/superpowers/plans/2026-08-21-staging-phases-4-6.md, deliberately
    # deferred — see context/DECISION_LOG.md.
    #
    # Runs AFTER `deploy`, so it reports rather than prevents: a failure here
    # means staging is already serving broken code. That is the accepted
    # trade-off for testing the artifact that is actually deployed, and staging
    # is where it is cheap to be wrong. Fix forward on the next push.
    needs: [deploy]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Smoke the deployed app
        run: npm run test:smoke
        working-directory: frontend
        env:
          # The deployed origin, not a pages.dev hash URL: CORS_ORIGINS is
          # exactly this host, so any other name is refused by design and the
          # login check would fail for the wrong reason.
          SMOKE_WEB_URL: https://app.boxops.dev

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # Carries the failure screenshot and trace — for a blank page, the
          # screenshot alone is usually the whole diagnosis.
          name: playwright-report-smoke
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
